project:
  type: manuscript

execute:
  freeze: auto

format:
  html:
    toc: true
    toc-location: right
    # a light/dark pair puts a theme toggle in the page header
    theme:
      light: cosmo
      dark: darkly

  # PDF is shelved while drafting. To restore it, uncomment this block AND
  # re-add `tinytex: true` to .github/workflows/publish.yml -- the PDF format is
  # the only reason CI needs a LaTeX installation.
  # pdf:
  #   pdf-engine: pdflatex
  #   include-in-header:
  #     - text: |
  #         \usepackage{mathtools}

manuscript:
  notebooks:
    - notebook: notebooks/sift_likelihood.qmd
      title: The SIFT Likelihood
